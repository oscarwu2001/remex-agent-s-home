<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent's Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" aria-label="Hospital map">
    <div class="sky-body" id="sky-body" aria-hidden="true"></div>
    <svg id="scene" role="img" aria-labelledby="scene-title">
      <title id="scene-title">Isometric hospital with a room for each kind of agent</title>
      <defs id="defs"></defs>
      <g id="world">
        <g id="clouds"></g>
        <g id="geometry"></g>
        <g id="mist"></g>
        <g id="labels"></g>
        <g id="people"></g>
      </g>
    </svg>
    <div class="camera" role="toolbar" aria-label="View">
      <button type="button" class="cam-btn wide" id="cam-overview" title="Back to the whole hospital (Esc)">Whole hospital</button>
      <span class="cam-where" id="cam-where" aria-live="polite"></span>
    </div>
    <p class="cam-hint">Drag to turn · right-drag to move · scroll to zoom · click a room to visit</p>
    <p class="source" id="source"></p>
  </main>

  <aside class="board" aria-label="Ward board">
    <header class="board-head">
      <div class="title-row">
        <h1>Agent's Home</h1>
        <button type="button" class="icon-btn" id="settings-open" aria-label="Settings" aria-expanded="false" aria-controls="settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <p class="census" id="census" aria-live="polite">Looking for sessions…</p>
    </header>

    <section class="board-section" aria-labelledby="on-shift-h">
      <h2 id="on-shift-h">On shift</h2>
      <div id="sessions"></div>
    </section>

    <section class="board-section chart" id="chart" aria-labelledby="chart-h" hidden>
      <h2 id="chart-h">Chart</h2>
      <div id="chart-body"></div>
    </section>

    <details class="board-section" id="directory">
      <summary><h2>Staff directory <span class="count" id="directory-count"></span></h2></summary>
      <ul id="directory-list" class="directory"></ul>
    </details>

    <section class="board-section problems" id="problems" hidden aria-labelledby="problems-h">
      <h2 id="problems-h">Needs attention</h2>
      <ul id="problem-list"></ul>
    </section>

    <section class="settings" id="settings" hidden aria-labelledby="settings-h" role="dialog">
      <header class="settings-head">
        <h2 id="settings-h">Settings</h2>
        <button type="button" class="icon-btn" id="settings-close" aria-label="Close settings" title="Close (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <section class="settings-group" aria-labelledby="look-h">
        <h3 id="look-h">Look</h3>
        <fieldset class="colourways" id="colourways">
          <legend>Colourway</legend>
          <div class="options">
            <label class="colourway blossom"><input type="radio" name="theme" value="blossom"><span class="dot" aria-hidden="true"></span>Blossom</label>
            <label class="colourway tide"><input type="radio" name="theme" value="tide"><span class="dot" aria-hidden="true"></span>Tide</label>
            <label class="colourway grove"><input type="radio" name="theme" value="grove"><span class="dot" aria-hidden="true"></span>Grove</label>
          </div>
        </fieldset>
        <label class="field" for="opt-time">Time of day
          <select id="opt-time">
            <option value="auto">Follow my clock</option>
            <option value="dawn">Early morning</option>
            <option value="morning">Morning</option>
            <option value="noon">Noon</option>
            <option value="afternoon">Afternoon</option>
            <option value="night">Night</option>
          </select>
        </label>
      </section>

      <section class="settings-group" aria-labelledby="screen-h">
        <h3 id="screen-h">On screen</h3>
        <label class="switch"><input type="checkbox" id="opt-private" checked> <span>Hide file names and commands</span></label>
        <label class="switch"><input type="checkbox" id="opt-names" checked> <span>Show name tags</span></label>
        <label class="switch"><input type="checkbox" id="opt-demo"> <span>Demo patients</span></label>
      </section>

      <section class="settings-group" id="layout-editor" aria-labelledby="layout-h">
        <h3 id="layout-h">Hospital layout <span class="count" id="layout-count"></span></h3>
        <div id="layout-body"></div>
      </section>
    </section>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
