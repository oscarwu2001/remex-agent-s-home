<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent's Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" data-i18n-aria-label="stage.map">
    <div class="sky-body" id="sky-body" aria-hidden="true"></div>
    <svg id="scene" role="img" aria-labelledby="scene-title">
      <title id="scene-title" data-i18n="stage.sceneTitle"></title>
      <defs id="defs"></defs>
      <g id="world">
        <g id="clouds"></g>
        <g id="geometry"></g>
        <g id="mist"></g>
        <g id="tint"></g>
        <g id="labels"></g>
        <g id="ghost" pointer-events="none"></g>
        <g id="people"></g>
      </g>
    </svg>
    <div class="weather" id="weather" aria-hidden="true"></div>
    <div class="gust" id="gust" aria-hidden="true"></div>
    <p class="clock" id="clock"></p>
    <div class="camera" role="toolbar" data-i18n-aria-label="stage.view">
      <button type="button" class="cam-btn wide" id="cam-overview" data-i18n-title="stage.overviewTip" data-i18n="stage.overview"></button>
      <span class="cam-where" id="cam-where" aria-live="polite"></span>
      <button type="button" class="cam-btn wide" id="cam-report" data-i18n-title="stage.reportTip" data-i18n="stage.report"></button>
      <button type="button" class="cam-btn wide" id="cam-mini" data-i18n-title="stage.miniTip" data-i18n="stage.mini"></button>
      <button type="button" class="cam-btn wide accent" id="cam-decorate" aria-expanded="false" aria-controls="decorate" hidden data-i18n="decor.decorate"></button>
    </div>
    <p class="cam-hint" data-i18n="stage.hint"></p>
    <section class="decorate" id="decorate" hidden aria-labelledby="decorate-h">
      <header class="settings-head">
        <h2 id="decorate-h" data-i18n="decor.decorate"></h2>
        <button type="button" class="icon-btn" id="decorate-close" data-i18n-aria-label="common.close" data-i18n-title="common.closeEsc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="decorate-body"></div>
    </section>
    <section class="live-map" id="live-map" hidden aria-labelledby="live-map-h">
      <header class="settings-head">
        <h2 id="live-map-h" data-i18n="map.title"></h2>
        <button type="button" class="icon-btn" id="live-map-close" data-i18n-aria-label="map.close" data-i18n-title="common.closeEsc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="live-map-body"></div>
    </section>
    <p class="visually-hidden" id="move-status" role="status"></p>
    <p class="source" id="source"></p>
  </main>

  <aside class="board" data-i18n-aria-label="board.aria">
    <header class="board-head">
      <div class="title-row">
        <h1>Agent's Home</h1>
        <button type="button" class="icon-btn" id="settings-open" data-i18n-aria-label="settings.title" aria-expanded="false" aria-controls="settings" data-i18n-title="settings.title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <p class="census" id="census" aria-live="polite" data-i18n="board.looking"></p>
    </header>

    <section class="board-section running" id="running" aria-labelledby="running-h">
      <h2 id="running-h" data-i18n="board.running"></h2>
      <p class="running-head" id="running-head" aria-live="polite"></p>
      <div id="waiting"></div>
      <div id="sessions"></div>
    </section>

    <section class="board-section proj-section" id="projects" aria-labelledby="projects-h">
      <div class="title-row"><h2 id="projects-h" data-i18n="board.projects"></h2>
        <button type="button" class="link-btn small" id="projects-file" data-i18n-title="board.listFileTip" data-i18n="board.listFile"></button></div>
      <p class="hint" id="projects-file-status" role="status"></p>
      <div id="projects-body"></div>
    </section>

    <section class="board-section field-section" id="field" hidden aria-labelledby="field-h">
      <h2 id="field-h" data-i18n="field.title"></h2>
      <div id="field-body"></div>
    </section>

    <section class="board-section line-section" id="line" hidden aria-labelledby="line-h">
      <h2 id="line-h" tabindex="-1" data-i18n="line.title"></h2>
      <div id="line-body"></div>
      <p class="line-status" id="line-status" role="status"></p>
    </section>

    <section class="board-section pack-offer" id="pack-offer" hidden aria-labelledby="pack-h" aria-live="polite"></section>

    <section class="board-section usage" id="usage" hidden aria-labelledby="usage-h">
      <h2 id="usage-h" data-i18n="usage.title"></h2>
      <div id="usage-body"></div>
    </section>

    <section class="board-section chart" id="chart" aria-labelledby="chart-h" hidden>
      <h2 id="chart-h" data-i18n="chart.title"></h2>
      <div id="chart-body"></div>
    </section>

    <details class="board-section" id="directory">
      <summary><h2><span data-i18n="board.directory"></span> <span class="count" id="directory-count"></span></h2></summary>
      <ul id="directory-list" class="directory"></ul>
    </details>

    <section class="board-section problems" id="problems" hidden aria-labelledby="problems-h">
      <h2 id="problems-h" data-i18n="problems.title"></h2>
      <ul id="problem-list"></ul>
    </section>

    <section class="settings" id="settings" hidden aria-labelledby="settings-h" role="dialog" tabindex="-1">
      <header class="settings-head">
        <h2 id="settings-h" data-i18n="settings.title"></h2>
        <button type="button" class="icon-btn" id="settings-close" data-i18n-aria-label="settings.close" data-i18n-title="common.closeEsc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <label class="field language-field" for="opt-language"><span data-i18n="settings.language"></span>
        <select id="opt-language"></select>
      </label>
      <p class="hint" id="language-note" role="status" hidden></p>

      <section class="settings-cat" id="group-look" data-group="look" aria-labelledby="group-look-name">
        <h3 class="group-h"><button type="button" class="group-toggle" id="group-look-btn" aria-expanded="false" aria-controls="group-look-body">
          <svg class="ico group-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span class="group-words"><span class="group-name" id="group-look-name" data-i18n="settings.group.look"></span>
          <span class="group-summary" id="group-look-summary"></span></span></button></h3>
        <div class="group-body" id="group-look-body" hidden>
          <section class="settings-group" aria-labelledby="look-h">
            <h4 id="look-h" tabindex="-1" data-i18n="settings.look"></h4>
            <fieldset class="colourways" id="colourways">
              <legend data-i18n="settings.colourway"></legend>
              <div class="options">
                <label class="colourway blossom"><input type="radio" name="theme" value="blossom"><span class="dot" aria-hidden="true"></span><span data-i18n="theme.blossom"></span></label>
                <label class="colourway tide"><input type="radio" name="theme" value="tide"><span class="dot" aria-hidden="true"></span><span data-i18n="theme.tide"></span></label>
                <label class="colourway grove"><input type="radio" name="theme" value="grove"><span class="dot" aria-hidden="true"></span><span data-i18n="theme.grove"></span></label>
              </div>
            </fieldset>
            <fieldset class="colourways" id="room-style">
              <legend data-i18n="settings.roomStyle"></legend>
              <div class="options">
                <label class="colourway style-simple"><input type="radio" name="detail" value="simple"><span data-i18n="settings.roomStyle.simple"></span></label>
                <label class="colourway style-detailed"><input type="radio" name="detail" value="detailed"><span data-i18n="settings.roomStyle.detailed"></span></label>
              </div>
            </fieldset>
            <label class="field" for="opt-time"><span data-i18n="settings.time"></span>
              <select id="opt-time">
                <option value="auto" data-i18n="time.auto"></option>
                <option value="dawn" data-i18n="phase.dawn"></option>
                <option value="morning" data-i18n="phase.morning"></option>
                <option value="noon" data-i18n="phase.noon"></option>
                <option value="afternoon" data-i18n="phase.afternoon"></option>
                <option value="night" data-i18n="phase.night"></option>
              </select>
            </label>
            <label class="field" for="opt-weather"><span data-i18n="settings.weather"></span>
              <select id="opt-weather">
                <option value="clear" data-i18n="weather.clear"></option>
                <option value="cloudy" data-i18n="weather.cloudy"></option>
                <option value="rain" data-i18n="weather.rain"></option>
                <option value="snow" data-i18n="weather.snow"></option>
                <option value="fog" data-i18n="weather.fog"></option>
                <option value="changing" data-i18n="weather.changing"></option>
              </select>
            </label>
            <label class="switch"><input type="checkbox" id="opt-live"> <span data-i18n="settings.live"></span></label>
            <div class="live" id="live-body" hidden></div>
            <p class="hint" id="live-hint"></p>
          </section>

          <section class="settings-group" id="layout-editor" aria-labelledby="layout-h">
            <h4 id="layout-h" tabindex="-1"><span data-i18n="settings.layout"></span> <span class="count" id="layout-count"></span></h4>
            <div id="layout-body"></div>
          </section>
        </div>
      </section>

      <section class="settings-cat" id="group-privacy" data-group="privacy" aria-labelledby="group-privacy-name">
        <h3 class="group-h"><button type="button" class="group-toggle" id="group-privacy-btn" aria-expanded="false" aria-controls="group-privacy-body">
          <svg class="ico group-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span class="group-words"><span class="group-name" id="group-privacy-name" data-i18n="settings.group.privacy"></span>
          <span class="group-summary" id="group-privacy-summary"></span></span></button></h3>
        <div class="group-body" id="group-privacy-body" hidden>
          <section class="settings-group" aria-labelledby="screen-h">
            <h4 id="screen-h" tabindex="-1" data-i18n="settings.screen"></h4>
            <label class="switch"><input type="checkbox" id="opt-private" checked> <span data-i18n="settings.private"></span></label>
            <label class="switch"><input type="checkbox" id="opt-names" checked> <span data-i18n="settings.names"></span></label>
          </section>

          <section class="settings-group" aria-labelledby="warn-h">
            <h4 id="warn-h" tabindex="-1" data-i18n="settings.warn"></h4>
            <p class="hint" data-i18n="settings.warn.hint"></p>
            <label class="field" for="opt-plan"><span data-i18n="settings.plan"></span>
              <select id="opt-plan" aria-describedby="plan-hint"></select></label>
            <p class="hint" id="plan-hint" data-i18n="settings.plan.hint"></p>
            <p class="form-error" id="plan-note" role="status" hidden></p>
            <label class="field" for="opt-budget"><span data-i18n="settings.budget"></span>
              <input id="opt-budget" type="number" min="0" step="100000" inputmode="numeric" data-i18n-placeholder="settings.budget.example"></label>
            <label class="switch"><input type="checkbox" id="opt-notify" checked> <span data-i18n="settings.notify"></span></label>
            <label class="field" for="opt-wait"><span data-i18n="settings.wait"></span>
              <select id="opt-wait">
                <option value="0" data-i18n="settings.wait.never"></option>
                <option value="2" data-i18n="time.minutes" data-i18n-n="2"></option>
                <option value="5" data-i18n="time.minutes" data-i18n-n="5"></option>
                <option value="10" data-i18n="time.minutes" data-i18n-n="10"></option>
                <option value="15" data-i18n="time.minutes" data-i18n-n="15"></option>
              </select>
            </label>
            <label class="switch"><input type="checkbox" id="opt-ends" checked> <span data-i18n="settings.ends"></span></label>
          </section>
        </div>
      </section>

      <section class="settings-cat" id="group-connect" data-group="connect" aria-labelledby="group-connect-name">
        <h3 class="group-h"><button type="button" class="group-toggle" id="group-connect-btn" aria-expanded="false" aria-controls="group-connect-body">
          <svg class="ico group-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span class="group-words"><span class="group-name" id="group-connect-name" data-i18n="settings.group.connect"></span>
          <span class="group-summary" id="group-connect-summary"></span></span></button></h3>
        <div class="group-body" id="group-connect-body" hidden>
          <section class="settings-group" aria-labelledby="field-settings-h">
            <h4 id="field-settings-h" tabindex="-1" data-i18n="settings.field"></h4>
            <p class="hint" data-i18n="settings.field.hint"></p>
            <label class="switch"><input type="checkbox" id="opt-field"> <span data-i18n="settings.field.switch"></span></label>
            <div class="field-settings" id="field-settings"></div>
          </section>

          <section class="settings-group" aria-labelledby="fleet-h">
            <h4 id="fleet-h" tabindex="-1" data-i18n="settings.fleet"></h4>
            <p class="hint" data-i18n="settings.fleet.hint"></p>
            <p class="hint" id="fleet-status" aria-live="polite"></p>
            <div class="form-actions">
              <button type="button" class="button" id="fleet-choose" data-i18n="settings.fleet.choose"></button>
              <button type="button" class="button" id="fleet-git" data-i18n="settings.fleet.git"></button>
              <button type="button" class="link-btn" id="fleet-off" hidden data-i18n="settings.fleet.off"></button>
            </div>
            <p class="hint" data-i18n-html="settings.fleet.gitHint"></p>
            <p class="hint" data-i18n="settings.fleet.cloud"></p>
          </section>

          <section class="settings-group" aria-labelledby="line-settings-h">
            <h4 id="line-settings-h" tabindex="-1" data-i18n="settings.line"></h4>
            <p class="hint" data-i18n="settings.line.hint"></p>
            <label class="switch"><input type="checkbox" id="opt-line"> <span data-i18n="settings.line.switch"></span></label>
            <div class="field-settings line-settings" id="line-settings"></div>
          </section>
        </div>
      </section>

      <section class="settings-cat" id="group-agents" data-group="agents" aria-labelledby="group-agents-name">
        <h3 class="group-h"><button type="button" class="group-toggle" id="group-agents-btn" aria-expanded="false" aria-controls="group-agents-body">
          <svg class="ico group-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span class="group-words"><span class="group-name" id="group-agents-name" data-i18n="settings.group.agents"></span>
          <span class="group-summary" id="group-agents-summary"></span></span></button></h3>
        <div class="group-body" id="group-agents-body" hidden>
          <section class="settings-group" aria-labelledby="pack-settings-h">
            <h4 id="pack-settings-h" tabindex="-1" data-i18n="settings.pack"></h4>
            <div id="pack-settings"></div>
          </section>

          <section class="settings-group" aria-labelledby="report-h">
            <h4 id="report-h" tabindex="-1" data-i18n="settings.report"></h4>
            <p class="hint" data-i18n="settings.report.hint"></p>
            <label class="field" for="report-days"><span data-i18n="settings.report.period"></span>
              <select id="report-days">
                <option value="7" data-i18n="settings.report.days" data-i18n-n="7"></option>
                <option value="28" selected data-i18n="settings.report.days" data-i18n-n="28"></option>
                <option value="90" data-i18n="settings.report.days" data-i18n-n="90"></option>
              </select>
            </label>
            <div class="form-actions report-actions">
              <button type="button" class="button" id="report-open" data-i18n="settings.report.open"></button>
              <button type="button" class="link-btn" id="report-files" data-i18n="settings.report.files"></button>
            </div>
            <p class="hint" id="report-status" aria-live="polite"></p>
          </section>
        </div>
      </section>

      <section class="settings-cat" id="group-app" data-group="app" aria-labelledby="group-app-name">
        <h3 class="group-h"><button type="button" class="group-toggle" id="group-app-btn" aria-expanded="false" aria-controls="group-app-body">
          <svg class="ico group-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span class="group-words"><span class="group-name" id="group-app-name" data-i18n="settings.group.app"></span>
          <span class="group-summary" id="group-app-summary"></span></span></button></h3>
        <div class="group-body" id="group-app-body" hidden>
          <section class="settings-group" aria-labelledby="demo-h">
            <h4 id="demo-h" tabindex="-1" data-i18n="settings.demo"></h4>
            <label class="switch"><input type="checkbox" id="opt-demo"> <span data-i18n="settings.demo.switch"></span></label>
            <p class="hint" data-i18n="settings.demo.hint"></p>
          </section>

          <section class="settings-group" aria-labelledby="update-h">
            <h4 id="update-h" tabindex="-1" data-i18n="settings.update"></h4>
            <p class="hint" id="update-version"></p>
            <div class="form-actions">
              <button type="button" class="button" id="update-run" data-i18n="settings.update.run"></button>
              <button type="button" class="button" id="update-agents" data-i18n="settings.update.agents"></button>
            </div>
            <p class="hint" id="update-status" aria-live="polite"></p>
            <p class="hint" data-i18n="settings.update.hint"></p>
          </section>

          <section class="settings-group" aria-labelledby="log-h">
            <h4 id="log-h" tabindex="-1" data-i18n="settings.log"></h4>
            <p class="hint" data-i18n="settings.log.hint"></p>
            <p class="hint" id="log-reminders" aria-live="polite"></p>
            <div class="form-actions">
              <button type="button" class="button" id="log-activity" data-i18n="settings.log.activity"></button>
              <button type="button" class="button" id="log-errors" data-i18n="settings.log.errors"></button>
              <button type="button" class="link-btn" id="log-open" data-i18n="settings.log.open"></button>
            </div>
            <pre class="log-view" id="log-view" tabindex="0" hidden data-i18n-aria-label="settings.log.lines"></pre>
          </section>
        </div>
      </section>
    </section>
  </aside>

  <section class="field-sheet" id="field-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="field-sheet-h" tabindex="-1">
    <header class="settings-head">
      <h2 id="field-sheet-h" data-i18n="field.title"></h2>
      <button type="button" class="icon-btn" id="field-sheet-close" data-i18n-aria-label="field.close" data-i18n-title="common.closeEsc">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div id="field-sheet-body"></div>
  </section>

  <section class="field-sheet line-sheet" id="line-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="line-sheet-h" tabindex="-1">
    <header class="settings-head">
      <h2 id="line-sheet-h" data-i18n="line.send.title"></h2>
      <button type="button" class="icon-btn" id="line-sheet-close" data-i18n-aria-label="line.send.close" data-i18n-title="common.closeEsc">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div id="line-sheet-body"></div>
    <p class="line-send-status" id="line-send-status" role="status"></p>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
