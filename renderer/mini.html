<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="mini.docTitle"></title>
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <header class="mini-head">
    <svg class="mascot" viewBox="-22 -58 44 66" aria-hidden="true" id="mascot"></svg>
    <div class="mini-title">
      <h1 data-i18n="board.running"></h1>
      <p class="headline" id="headline" aria-live="polite" data-i18n="board.looking"></p>
    </div>
    <div class="mini-actions">
      <button type="button" class="mini-btn" id="pin" aria-pressed="true" data-i18n-title="mini.pin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7"/></svg>
        <span class="visually-hidden" data-i18n="mini.pinShort"></span>
      </button>
      <button type="button" class="mini-btn" id="open-main" data-i18n-title="mini.openMain">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        <span class="visually-hidden" data-i18n="mini.openMain"></span>
      </button>
      <button type="button" class="mini-btn" id="close" data-i18n-title="mini.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        <span class="visually-hidden" data-i18n="mini.close"></span>
      </button>
    </div>
    <div class="tabs" role="tablist" data-i18n-aria-label="mini.tabs">
      <button type="button" role="tab" id="tab-now" aria-selected="true" aria-controls="list" data-i18n="mini.now"></button>
      <button type="button" role="tab" id="tab-projects" aria-selected="false" aria-controls="projects" tabindex="-1" data-i18n="board.projects"></button>
    </div>
  </header>
  <main>
    <section id="list" class="mini-list" role="tabpanel" aria-labelledby="tab-now"></section>
    <section id="projects" class="mini-list" role="tabpanel" aria-labelledby="tab-projects" hidden></section>
  </main>
  <footer class="mini-foot" id="foot"></footer>
  <script type="module" src="mini.js"></script>
</body>
</html>
